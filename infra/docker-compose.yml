services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: echodesk
      POSTGRES_USER: echodesk
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pw
    secrets: [db_pw]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echodesk"]
      interval: 10s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7.2.5
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      CELERY_ENQUEUE: "true"
      RECORDINGS_DIR: /var/rec
    volumes:
      - rec:/var/rec
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    command: celery -A app.tasks worker -Q dispatch,io_heavy,billing,report -l info --prefetch-multiplier=1
    environment:
      RECORDINGS_DIR: /var/rec
    volumes:
      - rec:/var/rec
    depends_on: [redis, db]
    restart: unless-stopped
  beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    command: celery -A app.tasks beat -l info
    depends_on: [redis, db]
    restart: unless-stopped
  voice:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: python -m app.voice.gateway
    restart: unless-stopped
  nginx:
    image: nginx:1.27.3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    ports: ["80:80"]
    depends_on: [api]
    restart: unless-stopped

secrets:
  db_pw:
    file: ../secrets/db_pw

volumes:
  pg: {}
  rec: {}
